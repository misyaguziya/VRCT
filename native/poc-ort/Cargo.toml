[package]
name = "poc-ort"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
# 既定は onnxruntime.dll を実行時に読む (Python 同梱の DLL を流用できるかの確認)。
default = ["dynamic", "gpu"]
dynamic = ["ort/load-dynamic"]
# ort がビルド時に pyke の CDN から onnxruntime を取ってきてリンクする方式。
# gpu と組み合わせると CUDA 13 + TensorRT + DirectML 入りの大きい版が選ばれる。
download = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-native"]
# CUDA / DirectML の EP を登録する API を有効にする (DLL 側が対応している必要がある)。
gpu = ["ort/cuda", "ort/directml"]

[dependencies]
# rc なので完全一致で固定する。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[build-dependencies]
cc = "1"
