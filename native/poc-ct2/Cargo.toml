[package]
name = "poc-ct2"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC: Whisper and NLLB through ct2rs, compared with the Python backend"

[dependencies]
ct2rs = { version = "=0.10.1", default-features = false, features = ["whisper", "dnnl", "openmp-runtime-comp"] }
tokenizers = "0.22"
rustfft = "6"
anyhow = "1"
serde_json = "1"
hound = "3"
