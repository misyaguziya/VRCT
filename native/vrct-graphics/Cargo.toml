[package]
name = "vrct-graphics"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Stage-1 PoC: Windows.Graphics.Capture into a Rust-owned D3D11 texture for SteamVR overlays"

[lib]
name = "vrct_graphics"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.24.2", features = ["extension-module", "abi3-py310"] }
windows = { version = "=0.61.1", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[profile.release]
lto = "thin"
codegen-units = 1
