# Rust バックエンドのワークスペース (docs/rust_backend_design_2026-10-11.md)。
# vrct-audio / vrct-graphics (もとは Python 版の拡張で、単独の Cargo.lock を持つ) と PoC は外す。
[workspace]
resolver = "2"
members = ["xtask", "vrct-contract", "vrct-ct2", "vrct-whisper", "vrct-ocr", "vrct-openvr", "vrct-overlay", "vrct-webtranslate", "vrct-backend"]
exclude = ["vrct-audio", "vrct-graphics", "poc-oscquery"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false
