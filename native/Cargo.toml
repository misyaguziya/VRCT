# Rust バックエンドのワークスペース (docs/rust_backend_design_2026-10-11.md)。
# PoC は外す。
[workspace]
resolver = "2"
members = ["xtask", "vrct-contract", "vrct-audio", "vrct-graphics", "vrct-ct2", "vrct-whisper", "vrct-ocr", "vrct-openvr", "vrct-overlay", "vrct-webtranslate", "vrct-backend"]
exclude = ["poc-oscquery"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false
