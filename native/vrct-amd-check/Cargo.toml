[package]
name = "vrct-amd-check"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Offline, process-isolated AMD and Vulkan diagnostic"

[dependencies]
anyhow = "1"
libloading = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
tokenizers = { version = "=0.19.1", default-features = false, features = ["onig"] }
hound = "3"
sha2 = "0.10"

[build-dependencies]
regex = "1"
cc = "1"
object = { version = "0.36", default-features = false, features = ["read_core", "pe", "std"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ErrorReporting",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }
