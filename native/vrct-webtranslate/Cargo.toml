[package]
name = "vrct-webtranslate"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors = ["misyaguziya"]
description = "Web translators (Google / Bing / Papago) from translator_engines, without the PyO3 entry points"
license-file = "LICENSE"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "http2", "gzip"] }
serde_json = "1"
obfstr = "0.4"
