[package]
name = "vrct-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "VRCT backend (sidecar): IPC, state, pipeline and the features"

[[bin]]
name = "VRCT-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
# reqwest's runtime: downloads with a read timeout (the blocking client has only a total one) and the WebSocket server
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
# The WebSocket server for the OBS browser source
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
# SO_REUSEADDR for the server port check (isAvailableWebSocketServer)
socket2 = "0.6"
base64 = "0.22"
form_urlencoded = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "3", default-features = false }
# OSC / OSCQuery with VRChat (mDNS discovery as VRChat does it)
vrchat_osc = "=2.2.0"
serde_json = { version = "1", features = ["preserve_order"] }
# window focus and paste, PrintWindow, process names
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
vrct-audio = { path = "../vrct-audio", features = ["devices"] }
vrct-ct2 = { path = "../vrct-ct2" }
vrct-ocr = { path = "../vrct-ocr" }
vrct-whisper = { path = "../vrct-whisper" }
vrct-openvr = { path = "../vrct-openvr" }
# D3D11 for SteamVR's mirror texture (OCR)
windows = { version = "=0.61.1", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
vrct-webtranslate = { path = "../vrct-webtranslate" }
# The same tokenizers as the Python backend's (tokenizers 0.19.1 wraps this crate). esaxx (training
# only) is built with the static CRT, which cannot be mixed with the /MD CTranslate2 shim.
tokenizers = { version = "=0.19.1", default-features = false, features = ["onig"] }
# Bundles sentencepiece 0.2.1, the version of the Python backend's sentencepiece (M2M100)
sentencepiece = "0.14"
# SudachiPy 0.6.10 is this crate at the same tag. Its dependencies are pinned in Cargo.lock to the
# tag's Cargo.lock (unicode-normalization, regex, ...), so the text normalization is the same.
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.6.10" }

[dev-dependencies]
base64 = "0.22"
# Python writes floats with repr(); read back bit for bit
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny_http = "0.12"
sha2 = "0.10"
