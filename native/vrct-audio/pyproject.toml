[build-system]
requires = ["maturin==1.8.3"]
build-backend = "maturin"

[project]
name = "vrct-audio"
version = "0.1.0"
requires-python = ">=3.10"
description = "VRCT native audio processing"
license = "MIT"

[tool.maturin]
locked = true
include = [
    { path = "THIRD_PARTY_LICENSES.txt", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "SPEECH_RECOGNITION_LICENSE.txt", format = ["sdist", "wheel"] },
]
