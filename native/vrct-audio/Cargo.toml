[package]
name = "vrct-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "PCM processing and in-process FLAC encoding for VRCT"

[lib]
name = "vrct_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
dasp_sample = "=0.11.0"
flacenc = { version = "=0.5.1", default-features = false }
pyo3 = { version = "=0.24.2", features = ["extension-module", "abi3-py310"], optional = true }
# Recording devices (WASAPI)
cpal = { version = "=0.16.0", optional = true }
windows = { version = "=0.61.1", optional = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# #[implement] (IMMNotificationClient) names it directly
windows-core = { version = "0.61", optional = true }

[dev-dependencies]
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[features]
# The extension module for the Python backend (pyproject.toml builds with it)
devices = ["dep:cpal", "dep:windows", "dep:windows-core"]
python = ["dep:pyo3", "devices"]

[profile.release]
lto = "thin"
codegen-units = 1
