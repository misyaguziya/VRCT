# 設定の書き込みと読み戻し (config.json は実行用のコピーの中だけに書かれる)。
# 機器・サーバー・オーバーレイを動かすもの (録音・OSC の受信・WebSocket など) はここに入れない。

[[case]]
name = "set transparency"
endpoint = "/set/data/transparency"
data = 80

[[case]]
name = "get transparency after set"
endpoint = "/get/data/transparency"

[[case]]
name = "set ui_scaling"
endpoint = "/set/data/ui_scaling"
data = 120

[[case]]
name = "set textbox_ui_scaling"
endpoint = "/set/data/textbox_ui_scaling"
data = 110

[[case]]
name = "set message_box_ratio"
endpoint = "/set/data/message_box_ratio"
data = 30

[[case]]
name = "set send_message_button_type"
endpoint = "/set/data/send_message_button_type"
data = "show"

[[case]]
name = "set font_family"
endpoint = "/set/data/font_family"
data = "Yu Gothic UI"

[[case]]
name = "set ui_language"
endpoint = "/set/data/ui_language"
data = "ja"

[[case]]
name = "get ui_language after set"
endpoint = "/get/data/ui_language"

[[case]]
name = "enable show_resend_button"
endpoint = "/set/enable/show_resend_button"

[[case]]
name = "disable show_resend_button"
endpoint = "/set/disable/show_resend_button"

[[case]]
name = "enable auto_clear_message_box"
endpoint = "/set/enable/auto_clear_message_box"

[[case]]
name = "disable send_only_translated_messages"
endpoint = "/set/disable/send_only_translated_messages"

[[case]]
name = "enable send_only_translated_messages"
endpoint = "/set/enable/send_only_translated_messages"

[[case]]
name = "enable overlay_show_only_translated_messages"
endpoint = "/set/enable/overlay_show_only_translated_messages"

[[case]]
name = "disable notification_vrc_sfx"
endpoint = "/set/disable/notification_vrc_sfx"

[[case]]
name = "enable main_window_sidebar_compact_mode"
endpoint = "/set/enable/main_window_sidebar_compact_mode"

[[case]]
name = "set mic_record_timeout"
endpoint = "/set/data/mic_record_timeout"
data = 4

[[case]]
name = "set mic_phrase_timeout"
endpoint = "/set/data/mic_phrase_timeout"
data = 5

[[case]]
name = "set mic_max_phrases"
endpoint = "/set/data/mic_max_phrases"
data = 8

[[case]]
name = "set mic_avg_logprob"
endpoint = "/set/data/mic_avg_logprob"
data = -0.9

[[case]]
name = "set mic_no_speech_prob"
endpoint = "/set/data/mic_no_speech_prob"
data = 0.7

[[case]]
name = "set mic_word_filter"
endpoint = "/set/data/mic_word_filter"
data = ["test", "テスト", "test"]

[[case]]
name = "set speaker_record_timeout"
endpoint = "/set/data/speaker_record_timeout"
data = 4

[[case]]
name = "set speaker_phrase_timeout"
endpoint = "/set/data/speaker_phrase_timeout"
data = 5

[[case]]
name = "set send_message_format_parts"
endpoint = "/set/data/send_message_format_parts"
data = { message = { prefix = "[", suffix = "]" }, separator = " / ", translation = { prefix = "(", separator = ", ", suffix = ")" }, translation_first = true }

[[case]]
name = "get send_message_format_parts after set"
endpoint = "/get/data/send_message_format_parts"

[[case]]
name = "set obs_browser_source_max_messages"
endpoint = "/set/data/obs_browser_source_max_messages"
data = 5

[[case]]
name = "set obs_browser_source_font_color"
endpoint = "/set/data/obs_browser_source_font_color"
data = "#ff8800"

[[case]]
name = "set ocr_poll_interval_ms"
endpoint = "/set/data/ocr_poll_interval_ms"
data = 1500

[[case]]
name = "set ocr_min_confidence"
endpoint = "/set/data/ocr_min_confidence"
data = 0.6

[[case]]
name = "enable convert_message_to_romaji"
endpoint = "/set/enable/convert_message_to_romaji"

[[case]]
name = "enable convert_message_to_hiragana"
endpoint = "/set/enable/convert_message_to_hiragana"

[[case]]
name = "set websocket host (server off)"
endpoint = "/set/data/websocket_host"
data = "127.0.0.1"

[[case]]
name = "get websocket auth token"
endpoint = "/get/data/websocket_auth_token"
rule = "shape"

[[case]]
name = "set obs font outline color (lower case)"
endpoint = "/set/data/obs_browser_source_font_outline_color"
data = " #abcdef "

[[case]]
name = "set obs fadeout duration (float string)"
endpoint = "/set/data/obs_browser_source_fadeout_duration"
data = " 7 "

[[case]]
name = "set mic word filter from a string"
endpoint = "/set/data/mic_word_filter"
data = "abca"

[[case]]
name = "set ocr window title (stripped)"
endpoint = "/set/data/ocr_window_title"
data = "  VRChat  "

[[case]]
name = "disable convert to romaji"
endpoint = "/set/disable/convert_message_to_romaji"

[[case]]
name = "enable convert to romaji"
endpoint = "/set/enable/convert_message_to_romaji"

[[case]]
name = "enable logger"
endpoint = "/set/enable/logger_feature"

[[case]]
name = "disable logger"
endpoint = "/set/disable/logger_feature"

[[case]]
name = "enable clipboard"
endpoint = "/set/enable/clipboard"

[[case]]
name = "disable clipboard"
endpoint = "/set/disable/clipboard"

[[case]]
name = "disable telemetry"
endpoint = "/set/disable/telemetry"
