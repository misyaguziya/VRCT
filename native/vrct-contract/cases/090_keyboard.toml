# VR キーボード。辞書の準備は VR UI を ON にするまで始まらない (ここでは OFF のままなので日本語・中国語は打てない。
# 状態は常に preparing だが、準備が始まる経路では時間で変わるので shape)。
# 英語と韓国語は辞書なしで打てる。VRChat へ送るのは 040 で OFF のまま。

[[case]]
name = "get keyboard_state"
endpoint = "/get/data/keyboard_state"
rule = "shape"  # 準備が始まっていない (preparing)

[[case]]
name = "keyboard: retry the dictionaries (offline: they fail again)"
endpoint = "/run/keyboard_retry"
rule = "shape"  # 失敗していないので何も始まらない (preparing のまま。名前は基準との照合のため変えない)

[[case]]
name = "get keyboard_language"
endpoint = "/get/data/keyboard_language"

[[case]]
name = "set keyboard_language to one it does not have"
endpoint = "/set/data/keyboard_language"
data = "fr"

[[case]]
name = "set keyboard_language to English"
endpoint = "/set/data/keyboard_language"
data = "en"

[[case]]
name = "keyboard: a key"
endpoint = "/run/keyboard_key"
data = "H"
rule = "shape"

[[case]]
name = "keyboard: a key that is not one"
endpoint = "/run/keyboard_key"
data = "Hello"
expect_status = 500

[[case]]
name = "set keyboard_send_to to a place it does not know"
endpoint = "/set/data/keyboard_send_to"
data = "elsewhere"

[[case]]
name = "get keyboard_send_to"
endpoint = "/get/data/keyboard_send_to"

[[case]]
name = "keyboard: Enter sends through VRCT (translated; told by keyboard_sent)"
endpoint = "/run/keyboard_key"
data = "Enter"
rule = "shape"

[[case]]
name = "set keyboard_language to Korean"
endpoint = "/set/data/keyboard_language"
data = "ko"

[[case]]
name = "keyboard: Korean syllable being made"
endpoint = "/run/keyboard_key"
data = "g"
rule = "shape"

[[case]]
name = "keyboard: clear"
endpoint = "/run/keyboard_clear"
rule = "shape"

[[case]]
name = "keyboard: the candidate index is not a number"
endpoint = "/run/keyboard_select"
data = "first"
expect_status = 500

[[case]]
name = "enable keyboard_chinese_simplified"
endpoint = "/set/enable/keyboard_chinese_simplified"

[[case]]
name = "disable keyboard_key_sound"
endpoint = "/set/disable/keyboard_key_sound"

[[case]]
name = "disable keyboard_typing_indicator"
endpoint = "/set/disable/keyboard_typing_indicator"

[[case]]
name = "get keyboard_typing_indicator"
endpoint = "/get/data/keyboard_typing_indicator"
