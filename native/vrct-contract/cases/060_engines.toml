# 言語・翻訳エンジン・文字起こしエンジンの選択と、その連動 (エンジンの一覧、使えないときの
# フォールバック)。API キーはオフライン (通信できない) での判定。

# --- 言語とエンジンの連動

[[case]]
name = "set your language to English"
endpoint = "/set/data/selected_your_languages"
data = { "1" = { "1" = { language = "English", country = "United States", enable = true } }, "2" = { "1" = { language = "Japanese", country = "Japan", enable = true } }, "3" = { "1" = { language = "Japanese", country = "Japan", enable = true } } }
pushes = true

[[case]]
name = "set target languages to Japanese and Korean"
endpoint = "/set/data/selected_target_languages"
data = { "1" = { "1" = { language = "Japanese", country = "Japan", enable = true }, "2" = { language = "Korean", country = "South Korea", enable = true }, "3" = { language = "English", country = "United States", enable = false } }, "2" = { "1" = { language = "English", country = "United States", enable = true }, "2" = { language = "English", country = "United States", enable = false }, "3" = { language = "English", country = "United States", enable = false } }, "3" = { "1" = { language = "English", country = "United States", enable = true }, "2" = { language = "English", country = "United States", enable = false }, "3" = { language = "English", country = "United States", enable = false } } }
pushes = true

[[case]]
name = "get selectable_translation_engines after the languages"
endpoint = "/get/data/selectable_translation_engines"

[[case]]
name = "set your languages not a dict"
endpoint = "/set/data/selected_your_languages"
data = "English"
expect_status = 500  # 検証の例外を捕まえない handler (Python 版と同じく 500)

[[case]]
name = "set translation engine DeepL without a key (falls back)"
endpoint = "/set/data/selected_translation_engines"
data = { "1" = "DeepL", "2" = "CTranslate2", "3" = "CTranslate2" }
pushes = true

[[case]]
name = "get selected_translation_engines after DeepL"
endpoint = "/get/data/selected_translation_engines"

[[case]]
name = "set translation engine not an engine"
endpoint = "/set/data/selected_translation_engines"
data = { "1" = "NoSuchEngine", "2" = "CTranslate2", "3" = "CTranslate2" }

[[case]]
name = "set translation engines back"
endpoint = "/set/data/selected_translation_engines"
data = { "1" = "CTranslate2", "2" = "CTranslate2", "3" = "CTranslate2" }

[[case]]
name = "set transcription engine Google (offline: not selectable)"
endpoint = "/set/data/selected_transcription_engine"
data = "Google"
pushes = true

[[case]]
name = "set transcription engine not an engine"
endpoint = "/set/data/selected_transcription_engine"
data = "NoSuchEngine"
expect_status = 500  # 検証の例外を捕まえない handler (Python 版と同じく 500)

[[case]]
name = "set transcription engine Whisper"
endpoint = "/set/data/selected_transcription_engine"
data = "Whisper"

