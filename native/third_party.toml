# バックエンドが同梱するネイティブライブラリ。今の Python 版と同じバイナリを、同じ版の wheel から取り出す。
# `cargo xtask fetch-native [--cuda]` が native/third_party/<name>/ に置く (git 管理外)。
#
# 版を上げるとき: version / wheel / sha256 を書き換える (sha256 は PyPI の JSON の digests.sha256)
# → fetch-native → ビルド → 回帰テスト。CTranslate2 はヘッダーも同じ版のタグに合わせる。
#
# files はアーカイブ内のパス。末尾の * は前方一致 (DLL の名前に版やハッシュが入るもの)。

[ctranslate2]
version = "4.6.0"
wheel = "ctranslate2-4.6.0-cp311-cp311-win_amd64.whl"
sha256 = "865649cebae240fe8c5b3e868354ea6c611d2ec17f335848caf890fca6c62d71"
files = ["ctranslate2/ctranslate2.dll", "ctranslate2/libiomp5md.dll", "ctranslate2/cudnn64_9.dll"]
# 受け口 (vrct-ct2 の shim) をコンパイルするための同じ版のヘッダー
headers_url = "https://github.com/OpenNMT/CTranslate2/archive/refs/tags/v4.6.0.tar.gz"
headers_sha256 = "9421d846668573466ceb713b27f71fb16fed8486ed7bdb654583c48c3c20621b"
headers_dir = "CTranslate2-4.6.0/include/"

[numpy]
# メル特徴量の行列積に使う OpenBLAS (numpy が呼んでいるものと同じ cblas_sgemm64_)
version = "1.26.4"
wheel = "numpy-1.26.4-cp311-cp311-win_amd64.whl"
sha256 = "cd25bcecc4974d09257ffcd1f098ee778f7834c3ad767fe5db785be9a4aa9cb2"
files = ["numpy.libs/libopenblas64_*"]

[onnxruntime]
version = "1.30.0"
wheel = "onnxruntime-1.30.0-cp311-cp311-win_amd64.whl"
sha256 = "0edd0145a6e3fce8a1276491dc784d615e3c58bcb952c9b4e5c876d5c6a12ad7"
files = ["onnxruntime/capi/onnxruntime.dll", "onnxruntime/capi/onnxruntime_providers_shared.dll"]

[openvr]
# Valve の OpenVR 1.26.7 の openvr_api.dll。今の Python 版の pyopenvr 1.26.701 が同梱しているものとバイト単位で同じ。
# vrct-openvr が関数テーブルで呼ぶ (openvr_sys クレートは SDK 2.x をソースからビルドし、CMake と libclang が要るため使わない)
version = "1.26.7"
url = "https://github.com/ValveSoftware/openvr/raw/v1.26.7/bin/win64/openvr_api.dll"
file = "openvr_api.dll"
sha256 = "5e591aa3f4a991edcc8910921833edafa67a1b117849bbb4e235df9833bed7a3"

# 以下は CUDA 版だけ (--cuda)。requirements_cuda.txt と同じ版。

[nvidia-cublas-cu12]
cuda = true
version = "12.8.4.1"
