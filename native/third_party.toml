[librime]
# VR キーボードの変換 (日本語・中国語)。RIME の公式ビルドの rime.dll。vrct-ime が実行時に読み込み関数の表で呼ぶ
# (rime-api クレートは bindgen と libclang を要するため使わない)。安定版 1.17.0 は GPL-3.0 の時点の librime-octagram を
# 組み込んでいるので、BSD-3-Clause に変わった後 (57d18b9) で作られた開発版 "latest" を使う (version-info.txt で確認)。
# 組み込まれた部品の表記は vrct-ime/RIME_THIRD_PARTY_NOTICES.txt。"latest" は作り直すたびに差し替わるので、同じ 7z を
# フォーク misyaguziya/librime のリリース vrct-7bc3fb0 に置いてそこから取る (中身は上流と同じ、SHA-256 も同じ)。
# 次の安定版が出たらそれに替える。
version = "latest-7bc3fb0"
