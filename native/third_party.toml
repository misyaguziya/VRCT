[openvr]
# Valve の OpenVR 1.26.7 の openvr_api.dll。今の Python 版の pyopenvr 1.26.701 が同梱しているものとバイト単位で同じ。
# vrct-openvr が関数テーブルで呼ぶ (openvr_sys クレートは SDK 2.x をソースからビルドし、CMake と libclang が要るため使わない)
version = "1.26.7"
url = "https://github.com/ValveSoftware/openvr/raw/v1.26.7/bin/win64/openvr_api.dll"
