[package]
name = "vrct-dev-sidecar"
version = "0.1.0"
edition = "2021"
description = "Development-time sidecar wrapper for VRCT: launches the venv Python interpreter against src-python/mainloop.py so Tauri dev doesn't require a PyInstaller build."
publish = false

[[bin]]
name = "VRCT-sidecar-x86_64-pc-windows-msvc"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = false
strip = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
