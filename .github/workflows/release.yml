name: Release VRCT

on:
  push:
    tags:
      - 'v*' # タグが 'v' で始まる場合にトリガー (例: v1.0.0)

jobs:
  release:
    name: Build VRCT
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: pwsh
        run: |
          $TAG_WITH_V = $env:GITHUB_REF -replace "^refs/tags/", ""
          $VERSION_NUM = $TAG_WITH_V -replace "^v", ""
          echo "VERSION=$VERSION_NUM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine release channel
        id: channel
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match "-(beta|rc)") {
            echo "is_beta=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "hf_repo=ms-software/VRCT-beta" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            echo "is_beta=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            echo "hf_repo=ms-software/VRCT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # package.json holds the version: tauri.conf.json points at it and the backend reads it at build time
      - name: Verify the version matches the tag
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match tag version ($expected)"
            exit 1
          }

      - name: Select the telemetry key of the channel
        env:
          TELEMETRY_KEY_STABLE: ${{ secrets.TELEMETRY_KEY_STABLE }}
          TELEMETRY_KEY_BETA: ${{ secrets.TELEMETRY_KEY_BETA }}
        shell: pwsh
        run: |
          if (-not $env:TELEMETRY_KEY_STABLE -or -not $env:TELEMETRY_KEY_BETA) {
            Write-Host "::error::TELEMETRY_KEY_STABLE / TELEMETRY_KEY_BETA secrets are not set."
            exit 1
          }
          # the Rust backend takes the key at build time (option_env!("VRCT_TELEMETRY_APP_KEY"))
          $key = if ("${{ steps.channel.outputs.is_beta }}" -eq "true") { $env:TELEMETRY_KEY_BETA } else { $env:TELEMETRY_KEY_STABLE }
          echo "VRCT_TELEMETRY_APP_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: npm run release-all

      - name: Compute SHA-256 of the installer
        id: sha256
        shell: pwsh
        run: |
          $exePath = "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe"
          $shaPath = "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe.sha256"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path $shaPath -Value $hash -NoNewline -Encoding ascii
          $cpuZipShaPath = "./VRCT.zip.sha256"
          $gpuZipShaPath = "./VRCT_cuda.zip.sha256"
          $cpuZipHash = (Get-FileHash -Path "./VRCT.zip" -Algorithm SHA256).Hash.ToLower()
          $gpuZipHash = (Get-FileHash -Path "./VRCT_cuda.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path $cpuZipShaPath -Value $cpuZipHash -NoNewline -Encoding ascii
          Set-Content -Path $gpuZipShaPath -Value $gpuZipHash -NoNewline -Encoding ascii
          echo "sha_path=$shaPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "cpu_zip_sha_path=$cpuZipShaPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "gpu_zip_sha_path=$gpuZipShaPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: pwsh
        run: |
          $UPLOAD_DIR = "./hf_upload_temp"
          New-Item -ItemType Directory -Force -Path $UPLOAD_DIR
          Copy-Item -Path ./VRCT.zip -Destination "$UPLOAD_DIR/VRCT.zip"
          Copy-Item -Path ./VRCT_cuda.zip -Destination "$UPLOAD_DIR/VRCT_cuda.zip"
          Copy-Item -Path ${{ steps.sha256.outputs.cpu_zip_sha_path }} -Destination "$UPLOAD_DIR/VRCT.zip.sha256"
          Copy-Item -Path ${{ steps.sha256.outputs.gpu_zip_sha_path }} -Destination "$UPLOAD_DIR/VRCT_cuda.zip.sha256"
          Copy-Item -Path "./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe" -Destination "$UPLOAD_DIR/VRCT_setup.exe"

          # reads HF_TOKEN; uploads the folder's files to the repo root as one commit
          npx --yes @huggingface/hub@2.17.8 upload --repo-type model --commit-message "👍️[Update] ${{ env.VERSION }} Release" ${{ steps.channel.outputs.hf_repo }} $UPLOAD_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # the hfjs CLI has no tag command: POST /api/models/<repo>/tag/<revision> (what huggingface_hub's create_tag calls)
          $body = @{ tag = "${{ github.ref_name }}"; message = "Release ${{ github.ref_name }}" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://huggingface.co/api/models/${{ steps.channel.outputs.hf_repo }}/tag/main" -Headers @{ Authorization = "Bearer $env:HF_TOKEN" } -ContentType "application/json" -Body $body

          Remove-Item -Recurse -Force $UPLOAD_DIR

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ env.VERSION }}
          draft: false
          prerelease: ${{ steps.channel.outputs.is_beta }}

      - name: Upload Release Asset (NSIS Installer)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe
          asset_name: VRCT_${{ env.VERSION }}_x64-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (SHA-256 checksum)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.sha256.outputs.sha_path }}
          asset_name: VRCT_${{ env.VERSION }}_x64-setup.exe.sha256
          asset_content_type: text/plain
